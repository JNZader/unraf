name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'DIATO/estudio/**'
      - 'DIATO/trabajo-final-iato/**'
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build estudio HTML
        run: |
          cd "DIATO/estudio"
          python3 build_html_v2.py

      - name: Build trabajo-final-iato HTML
        run: |
          cd "DIATO/trabajo-final-iato"
          python3 build_html_v2.py

      - name: Assemble site
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp -r "DIATO/estudio/build" _site/estudio
          cp -r "DIATO/trabajo-final-iato/build" _site/trabajo-final-iato
          ls -la _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
